[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cert-atlas"
version = "1.0.0"
description = "A labelled corpus of valid and forged certificates, and a two-sided metric for scoring verifiers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicholas Harris" }]
keywords = ["benchmark", "verification", "adversarial", "certificates", "soundness", "eda"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
]
# Dependencies use PEP 508 direct references so `pip install ./cert-atlas` works
# for anyone, today, with nothing published to a package index. They resolve from
# the public GitHub repositories.
#
# For a future PyPI release these become plain version specifiers
# ("lcert-verify>=1.0.0", ...) — PyPI rejects direct references. That swap is a
# one-line change at release time and is deliberately NOT on the critical path.
dependencies = [
    "lcert-verify @ git+https://github.com/nickharris808/lcert-verify.git@main",
    "equiv-receipt @ git+https://github.com/nickharris808/equiv-receipt.git@main",
    "prereg-seal @ git+https://github.com/nickharris808/prereg-seal.git@main",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
cert-atlas = "cert_atlas.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
