[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cert-atlas"
version = "1.0.0"
description = "A labelled corpus of valid and forged certificates, and a two-sided metric for scoring verifiers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicholas Harris" }]
keywords = ["benchmark", "verification", "adversarial", "certificates", "soundness", "eda"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
]
dependencies = ["lcert-verify>=1.0.0", "equiv-receipt>=1.0.0", "prereg-seal>=1.0.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
cert-atlas = "cert_atlas.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
